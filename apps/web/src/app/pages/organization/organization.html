<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center gap-2 text-lg font-semibold text-neutral-800">
    <p>Organization</p>
    <lucide-icon
      [img]="Building"
      class="w-5 h-5"
    />
  </div>

  <!-- Table -->
  <div class="rounded-xl border border-neutral-200 bg-white">
    <!-- Header Row -->
    <div class="grid grid-cols-3 gap-4 border-b px-4 py-3 text-sm font-medium text-neutral-500">
      <p>Division</p>
      <p>Position</p>
      <p>Actions</p>
    </div>

    <!-- Rows -->
    @for (item of currentItems(); track item.id) {
      <div class="grid grid-cols-3 gap-4 border-b last:border-0 px-4 py-3 text-sm text-neutral-700">
        <p>{{ item.department }}</p>
        <p>{{ item.units }}</p>

        <div class="flex items-center gap-3 text-neutral-500">
          <lucide-icon
            [img]="Pencil"
            class="w-4 h-4 cursor-pointer hover:text-neutral-800"
          />
          <lucide-icon
            [img]="Trash2"
            class="w-4 h-4 cursor-pointer hover:text-red-600"
          />
        </div>
      </div>
    }

    <!-- Pagination -->
    <div class="flex items-center justify-center gap-2 px-4 py-3">
      <button
        class="px-2 py-1 text-sm rounded border disabled:opacity-40"
        (click)="prevPage()"
        [disabled]="currentPage() === 1"
      >
        &lt;
      </button>

      @for (page of pageNumbers; track page) {
        <button
          class="px-3 py-1 text-sm rounded border transition"
          [class.bg-neutral-900]="currentPage() === page"
          [class.text-white]="currentPage() === page"
          [class.border-neutral-900]="currentPage() === page"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
      }

      <button
        class="px-2 py-1 text-sm rounded border disabled:opacity-40"
        (click)="nextPage()"
        [disabled]="currentPage() === totalPages"
      >
        &gt;
      </button>
    </div>
  </div>
</div>

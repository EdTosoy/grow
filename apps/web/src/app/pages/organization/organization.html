<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center gap-2 text-lg font-semibold text-teal-500">
    <p>Organization</p>
    <lucide-icon
      [img]="Building"
      class="w-5 h-5"
    />
  </div>

  <!-- Table -->
  <div class="rounded-xl border border-neutral-200 bg-white">
    <!-- Header Row -->
    <div class="grid grid-cols-3 bg-gray-50 text-center py-3 text-sm font-medium text-gray-600">
      <p>Division</p>
      <p>Position</p>
      <p>Actions</p>
    </div>

    <!-- Rows -->
    <div class="divide-y divide-gray-100">
      @for (item of currentItems(); track item.id) {
        <div
          class="grid grid-cols-3 gap-4 border-b last:border-0 px-4 py-3 text-sm text-neutral-700"
        >
          <p>{{ item.department }}</p>
          <p class="text-center">{{ item.units }}</p>

          <div class="flex items-center justify-center gap-4 text-neutral-500">
            <lucide-icon
              [img]="Pencil"
              class="w-5 h-5 cursor-pointer hover:text-neutral-800"
            />
            <lucide-icon
              [img]="Trash2"
              class="w-5 h-5 cursor-pointer hover:text-red-600"
            />
          </div>
        </div>
      }
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-center gap-2 px-4 py-3">
      <button
        class="px-2 py-1 text-sm rounded border disabled:opacity-40"
        (click)="prevPage()"
        [disabled]="currentPage() === 1"
      >
        &lt;
      </button>

      @for (page of pageNumbers; track page) {
        <button
          class="px-3 py-1 text-sm rounded border transition"
          [class.bg-teal-500]="currentPage() === page"
          [class.text-white]="currentPage() === page"
          [class.border]="currentPage() === page"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
      }

      <button
        class="px-2 py-1 text-sm rounded border disabled:opacity-40"
        (click)="nextPage()"
        [disabled]="currentPage() === totalPages"
      >
        &gt;
      </button>
    </div>
  </div>
</div>

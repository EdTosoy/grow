<div class="mx-auto max-w-5xl space-y-8 p-6">
  <!-- Header -->
  <div class="flex items-center gap-3 text-teal-500">
    <h1 class="text-xl font-semibold">Uniform</h1>
    <lucide-icon [img]="Shirt" />
  </div>

  <!-- Table -->
  <div class="rounded-xl border border-zinc-200 overflow-hidden">
    <!-- Header -->
    <div class="grid grid-cols-5 bg-gray-50 text-center py-3 text-sm font-medium text-gray-600">
      <p>Name</p>
      <p>Position</p>
      <p>Department</p>
      <p>Sizes</p>
      <p>Submitted On</p>
    </div>

    <!-- Rows -->
    <div class="divide-y divide-gray-100">
      @for (item of currentItems(); track item.id) {
        <div class="grid grid-cols-5 gap-4 border-b last:border-0 px-4 py-4 text-sm">
          <p class="font-medium">{{ item.name }}</p>
          <p class="text-gray-500">{{ item.position }}</p>
          <p class="text-gray-500">{{ item.department }}</p>
          <p class="text-gray-500">
            {{ item.chooseInPerson ? item.sizes.top + ', ' + item.sizes.bottom : 'Personal' }}
          </p>

          <p class="text-gray-500">
            {{ item.signedDate || '--' }}
          </p>
        </div>
      }
    </div>
  </div>
  <lib-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="goToPage($event)"
  />
</div>

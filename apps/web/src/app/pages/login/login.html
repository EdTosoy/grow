<div class="w-screen h-screen flex items-center justify-center bg-cover bg-no-repeat md:bg-none">
  <div class="flex flex-col max-h-175 w-117.5 bg-white rounded-lg p-[60px_50px]">
    <lib-company-logo />
    <div class="flex flex-col mt-12.5">
      <form class="flex flex-col gap-2.5 mb-2.5">
        <input
          type="text"
          name="email"
          id="email"
          placeholder="email"
          class="h-15 text-base rounded-md border-none bg-gray-200 px-5 pr-12.5 text-gray-500 outline-none w-full"
        />

        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            id="password"
            placeholder="password"
            class="h-15 text-base rounded-md border-none bg-gray-200 px-5 pr-12.5 text-gray-500 outline-none w-full"
          />
          <p
            (click)="handleShowPassword()"
            aria-hidden="true"
            class="absolute right-4 top-1/2 -translate-y-2/5 text-gray-500 cursor-pointer"
          >
            <lucide-icon [img]="showPassword ? Eye : EyeOff"></lucide-icon>
          </p>
        </div>

        <button
          (click)="handleLogin($event)"
          class="h-15 bg-[#17b8a6] hover:bg-[#36cdbb] rounded-md text-white text-lg flex items-center justify-center gap-2.5 cursor-pointer"
        >
          <lucide-icon [img]="SendHorizontal"></lucide-icon>
          Login
        </button>
      </form>

      <p class="mb-12.5 text-[#17b8a6] cursor-pointer">
        <a
          routerLink="/forgot-password"
          class="text-[#17b8a6] no-underline"
        >
          forgot password?
        </a>
      </p>

      <p class="text-gray-700">
        By logging in, you agree with our
        <a
          routerLink="/terms-of-use"
          class="text-[#17b8a6] no-underline cursor-pointer"
        >
          Terms of Use
        </a>
        and
        <a
          routerLink="/privacy-policy"
          class="text-[#17b8a6] no-underline cursor-pointer"
        >
          Privacy Policy
        </a>
        .
      </p>
    </div>
  </div>
</div>

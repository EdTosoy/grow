<div class="mx-auto max-w-3xl space-y-8 p-6">
  <!-- Header -->
  <div class="flex items-center gap-3 text-teal-500">
    <h1 class="text-xl font-semibold">Uniform</h1>
    <lucide-icon [img]="Shirt" />
  </div>

  <!-- Top Size -->
  <section class="space-y-2">
    <label
      for="top"
      class="text-sm font-medium text-gray-700"
    >
      Top
    </label>

    <div class="relative">
      <select
        id="top"
        [disabled]="isInPerson()"
        (change)="onTopChange($event)"
        class="w-full appearance-none rounded-md border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 disabled:bg-gray-100"
      >
        <option
          value=""
          disabled
          selected
        >
          Please select…
        </option>
        <option value="xs">Extra Small – XS</option>
        <option value="s">Small – S</option>
        <option value="m">Medium – M</option>
        <option value="l">Large – L</option>
        <option value="xl">Extra Large – XL</option>
        <option value="xxl">Double Extra Large – 2XL</option>
        <option value="xxxl">Triple Extra Large – 3XL</option>
      </select>

      <lucide-icon
        [img]="ChevronDown"
        class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"
      />
    </div>
  </section>

  <!-- Bottom Size -->
  <section class="space-y-2">
    <label
      for="bottom"
      class="text-sm font-medium text-gray-700"
    >
      Bottom
    </label>

    <div class="relative">
      <select
        id="bottom"
        [disabled]="isInPerson()"
        (change)="onBottomChange($event)"
        class="w-full appearance-none rounded-md border border-gray-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 disabled:bg-gray-100"
      >
        <option
          value=""
          disabled
          selected
        >
          Please select…
        </option>
        <option value="xs">Extra Small – XS</option>
        <option value="s">Small – S</option>
        <option value="m">Medium – M</option>
        <option value="l">Large – L</option>
        <option value="xl">Extra Large – XL</option>
        <option value="xxl">Double Extra Large – 2XL</option>
        <option value="xxxl">Triple Extra Large – 3XL</option>
      </select>

      <lucide-icon
        [img]="ChevronDown"
        class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"
      />
    </div>
  </section>

  <!-- In-person Checkbox -->
  <section>
    <label class="flex cursor-pointer items-center gap-3 text-sm text-gray-700">
      <input
        type="checkbox"
        class="h-4 w-4 rounded border-gray-300 text-teal-500 focus:ring-teal-400"
        [checked]="isInPerson()"
        (change)="toggleInPerson()"
      />
      Prefer choosing in-person?
    </label>
  </section>

  <!-- Submit -->
  <div class="flex justify-end">
    <button
      type="button"
      (click)="submit()"
      class="rounded-md bg-teal-500 px-6 py-2 text-sm font-medium text-white transition hover:bg-teal-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-400"
    >
      Submit
    </button>
  </div>
</div>

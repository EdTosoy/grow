<div class="mx-auto max-w-5xl space-y-8 p-6">
  <!-- Header -->
  <div class="flex items-center gap-3 text-teal-500">
    <h1 class="text-xl font-semibold">Touchpoints</h1>
    <lucide-icon [img]="Handshake" />
  </div>

  <!-- Table -->
  <div class="rounded-xl border border-zinc-200 overflow-hidden">
    <!-- Header -->
    <div class="grid grid-cols-5 bg-gray-50 text-center py-3 text-sm font-medium text-gray-600">
      <p>Name</p>
      <p>Position</p>
      <p>Department</p>
      <p>Sizes</p>
      <p>Submitted On</p>
    </div>

    <!-- Table Rows -->
    <div class="divide-y divide-gray-100">
      @for (item of currentItems(); track item.id) {
        <div class="grid grid-cols-5 gap-4 border-b last:border-0 px-4 py-4 text-sm">
          <p class="font-medium">{{ item.name }}</p>
          <p class="text-gray-500">{{ item.position }}</p>
          <p class="text-gray-500">{{ item.department }}</p>
          <p
            class="font-medium"
            [class.text-emerald-600]="item.status === 'Approved'"
            [class.text-amber-600]="item.status === 'Pending'"
            [class.text-red-600]="item.status === 'Rejected'"
          >
            {{ item.status }}
          </p>

          <p class="text-neutral-500">
            {{ item.signedDate || '--' }}
          </p>
        </div>
      }
    </div>
  </div>
  <div class="flex items-center justify-center gap-1 mt-4 pt-2">
    <!-- Prev Button -->
    <button
      (click)="prevPage()"
      [disabled]="currentPage() === 1"
      class="px-3 py-1.5 text-xs rounded border border-black/10 text-[#737373] hover:bg-[#17b8a6] hover:text-white hover:border-[#17b8a6] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-[#737373] disabled:hover:border-black/10 transition-colors cursor-pointer"
    >
      &lt;
    </button>

    <!-- Page Number Buttons -->
    @for (pageNum of pageNumbers(); track pageNum) {
      <button
        (click)="goToPage(pageNum)"
        class="px-3 py-1.5 text-xs rounded border transition-colors cursor-pointer"
        [class]="
          currentPage() === pageNum
            ? 'bg-[#17b8a6] text-white border-[#17b8a6]'
            : 'border-black/10 text-[#737373] hover:bg-[#17b8a6] hover:text-white hover:border-[#17b8a6]'
        "
      >
        {{ pageNum }}
      </button>
    }

    <!-- Next Button -->
    <button
      (click)="nextPage()"
      [disabled]="currentPage() >= totalPages()"
      class="px-3 py-1.5 text-xs rounded border border-black/10 text-[#737373] hover:bg-[#17b8a6] hover:text-white hover:border-[#17b8a6] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-transparent disabled:hover:text-[#737373] disabled:hover:border-black/10 transition-colors cursor-pointer"
    >
      &gt;
    </button>
  </div>
</div>

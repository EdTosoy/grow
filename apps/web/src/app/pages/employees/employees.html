<div class="mx-auto max-w-5xl space-y-8 p-6">
  <!-- Header -->

  <div class="flex items-center gap-3 text-teal-500">
    <h1 class="text-xl font-semibold">Employees</h1>
    <lucide-icon [img]="SquareUser" />
  </div>

  <!-- Table -->
  <div class="rounded-xl border border-neutral-200 bg-white">
    <!-- Table Header -->
    <div class="grid grid-cols-5 bg-gray-50 text-center py-3 text-sm font-medium text-gray-600">
      <p>Name</p>
      <p>Position</p>
      <p>Department</p>
      <p>Status</p>
      <p>Submitted On</p>
    </div>

    <!-- Table Rows -->
    <div class="divide-y divide-gray-100">
      @for (item of currentItems(); track item.id) {
        <div class="grid grid-cols-5 gap-4 border-b last:border-0 px-4 py-4 text-sm">
          <p class="font-medium">{{ item.name }}</p>
          <p class="text-gray-500">{{ item.position }}</p>
          <p class="text-gray-500">{{ item.department }}</p>

          <p
            class="font-medium"
            [class.text-emerald-600]="item.status === 'Approved'"
            [class.text-amber-600]="item.status === 'Pending'"
            [class.text-red-600]="item.status === 'Rejected'"
          >
            {{ item.status }}
          </p>

          <p class="text-neutral-500">
            {{ item.signedDate || '--' }}
          </p>
        </div>
      }
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-center gap-2 px-4 py-3">
      <button
        class="rounded border px-2 py-1 text-sm disabled:opacity-40"
        (click)="prevPage()"
        [disabled]="currentPage() === 1"
      >
        &lt;
      </button>

      @for (page of pageNumbers; track page) {
        <button
          class="rounded border px-3 py-1 text-sm transition"
          [class.bg-teal-500]="currentPage() === page"
          [class.text-white]="currentPage() === page"
          [class.border]="currentPage() === page"
          (click)="goToPage(page)"
        >
          {{ page }}
        </button>
      }

      <button
        class="rounded border px-2 py-1 text-sm disabled:opacity-40"
        (click)="nextPage()"
        [disabled]="currentPage() === totalPages"
      >
        &gt;
      </button>
    </div>
  </div>
</div>

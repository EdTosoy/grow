<div class="mx-auto max-w-6xl space-y-8 p-6">
  <!-- Header -->
  <div class="flex items-center gap-3 text-teal-500">
    <h1 class="text-xl font-semibold">Touchpoints</h1>
    <lucide-icon [img]="Handshake" />
  </div>

  <!-- Table -->
  <div class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
    <!-- Header Row -->
    <div
      class="grid grid-cols-6 bg-gray-50 px-6 py-3 text-sm text-center font-medium text-gray-600"
    >
      <p>Schedule</p>
      <p>Name</p>
      <p>Position</p>
      <p>Department</p>
      <p>Signed</p>
      <p>Actions</p>
    </div>

    <!-- Data Rows -->
    <div class="divide-y divide-gray-100">
      @for (item of currentItems(); track item.id) {
        <div class="grid grid-cols-6 items-center px-4 py-4 text-sm">
          <!-- Schedule -->
          <div class="space-y-1">
            <p class="font-medium text-gray-900">
              {{ item.scheduleDate }}
            </p>
            <p class="text-gray-500">
              {{ item.scheduledTime }}
            </p>
          </div>

          <p>{{ item.name }}</p>
          <p>{{ item.position }}</p>
          <p>{{ item.department }}</p>

          <!-- Signed -->
          <p class="font-medium text-gray-900">
            {{ item.signedDate || '--' }}
          </p>

          <!-- Action -->
          <div>
            <button
              (click)="notifyHR(item.id)"
              class="rounded-md bg-teal-500 px-4 py-1.5 text-xs font-medium text-white transition hover:bg-teal-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-400"
            >
              Notify HR
            </button>
          </div>
        </div>
      }
    </div>

    <lib-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="goToPage($event)"
    />
  </div>
</div>
